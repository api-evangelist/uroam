name: Uroam
description: uRoam, Inc. (1999-2003) was a Canaan Partners-backed security company that
  built FirePass, a clientless SSL-VPN appliance for "radically simplified remote access"
  to enterprise applications from any browser. After merging with Filanet, uRoam was
  acquired by F5 Networks in July 2003 for $25 million in cash, and FirePass became
  F5's SSL VPN product line. The company is defunct; uroam.com now redirects to f5.com,
  and uRoam publishes no APIs or developer surface of its own.
